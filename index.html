function splitHeadline(){let i=0;for(const [id,text] of [['row1',translations[language].line1],['row2',translations[language].line2]]){const el=document.getElementById(id);el.replaceChildren();if(language==='fa'){el.textContent=text;el.classList.add('ch');el.style.setProperty('--i',i++);continue}el.classList.remove('ch');for(const ch of text){if(ch===' '){el.append(document.createTextNode(' '));continue}const span=document.createElement('span');span.className='ch';span.style.setProperty('--i',i++);span.textContent=ch;el.append(span)}}document.getElementById('headline').setAttribute('aria-label',translations[language].line1+' '+translations[language].line2)}
function applyLanguage(){document.documentElement.lang=language;document.documentElement.dir=language==='fa'?'rtl':'ltr';document.getElementById('lang').value=language;document.querySelectorAll('[data-i]').forEach(el=>{if(translations[language][el.dataset.i])el.innerHTML=translations[language][el.dataset.i]});document.getElementById('lang').setAttribute('aria-label',translations[language].language);document.getElementById('close').setAttribute('aria-label',translations[language].close);burger.setAttribute('aria-label',translations[language].menu);splitHeadline();try{localStorage.setItem('maditech-language',language)}catch{}if(currentPanel&&dialog.open)renderPanel(currentPanel)}
try{const saved=localStorage.getItem('maditech-language');if(['en','fr','fa'].includes(saved))language=saved}catch{}applyLanguage();

function paragraph(text){const p=document.createElement('p');p.textContent=text;return p}function heading(text,level=3){const h=document.createElement('h'+level);h.textContent=text;if(level===2)h.id='dialog-title';return h}function button(text,fn){const b=document.createElement('button');b.className='action';b.type='button';b.textContent=text;b.onclick=fn;return b}
function renderPanel(type){const t=translations[language];content.replaceChildren();if(type==='services'){content.append(heading(t.services,2),paragraph(t.servicesIntro));for(const service of t.serviceItems){const section=document.createElement('section');section.className='topic';section.append(heading(service.title),paragraph(service.text));const ul=document.createElement('ul');for(const line of service.items){const li=document.createElement('li');li.textContent=line;ul.append(li)}section.append(ul);content.append(section)}content.append(button(t.join,()=>renderPanel('brief')))}else if(type==='founder'){content.append(heading(t.founderName,2),paragraph(t.founderRole));const image=document.createElement('img');image.src=document.querySelector('.card.two img').src;image.alt=t.founderName;image.decoding='async';content.append(image,paragraph(t.founderText),button(t.join,()=>renderPanel('brief')))}else if(type==='vision'){content.append(heading(t.visionTitle,2),paragraph(t.visionText),heading(t.approach),paragraph(t.approachText),button(t.explore,()=>renderPanel('services')))}else{content.append(heading(t.briefTitle,2),paragraph(t.briefIntro));const form=document.createElement('form');for(const [name,label,multi] of [['name',t.name,false],['email',t.email,false],['message',t.message,true]]){const l=document.createElement('label');l.textContent=label;const input=document.createElement(multi?'textarea':'input');input.name=name;input.required=true;input.maxLength=multi?2000:100;if(name==='email'){input.type='email';input.maxLength=254;input.dir='ltr'}if(multi)input.rows=4;l.append(input);form.append(l)}const save=document.createElement('button');save.className='action dark';save.type='submit';save.textContent=t.download;const hint=paragraph(t.draftNotice);hint.className='hint';const status=paragraph('');status.setAttribute('role','status');form.append(save,hint,status);form.onsubmit=e=>{e.preventDefault();const data={name:form.elements.name.value,email:form.elements.email.value,message:form.elements.message.value,language,status:'draft-not-sent'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maditech-project-brief.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=t.saved};content.append(form)}currentPanel=type;content.parentElement.scrollTop=0}
function openPanel(type){menu.hidden=true;burger.setAttribute('aria-expanded','false');renderPanel(type);dialog.dir=document.documentElement.dir;if(!dialog.open)dialog.showModal()}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>currentPanel=null);dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
const AXIS=-16.6*Math.PI/180,AX=Math.cos(AXIS),AY=Math.sin(AXIS),SLAB_MS=300,SLAB=.5,GROW_MS=700,CY=.50,RK=.56,EDGE_PX=1.5,DRIFT=.205,DRIFT_MS=25000,REV_LERP=.10;const reduced=matchMedia('(prefers-reduced-motion:reduce)'),touch=matchMedia('(hover:none)');const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=(t,p)=>1-(1-t)**p;let W=0,H=0,BR=0,D1=0,D2=0,V2=0,t0=0,doneAt=0,raf=0,seen=false,running=false,m={x:-9999,y:-9999},target={x:-9999,y:-9999};const cache=new Map();function setVar(k,v){if(cache.get(k)!==v){stage.style.setProperty(k,v);cache.set(k,v)}}function measure(){W=hero.clientWidth;H=hero.clientHeight;BR=RK*H;D1=SLAB*W;D2=(1-SLAB)*W+BR;V2=2.2*D2/GROW_MS;setVar('--oy',CY*H+'px');setVar('--or',BR+'px');setVar('--oi',Math.max(0,BR-EDGE_PX)+'px')}function travel(t){if(t<=SLAB_MS){const a=2*D1/SLAB_MS-V2,b=(V2*SLAB_MS-D1)/SLAB_MS**2;return a*t+b*t*t}const p=clamp((t-SLAB_MS)/GROW_MS,0,1);return D1+D2*easeOut(p,2.2)}
function tick(now){raf=0;if(document.hidden||!running)return;const t=now-t0;if(reduced.matches){stage.classList.add('done');setVar('--tx','0px');setVar('--ty','0px')}else{if(t<SLAB_MS+GROW_MS)setVar('--ox',W-travel(t)+BR+'px');else if(!doneAt){stage.classList.add('done');doneAt=now}const ps=easeOut(clamp(t/SLAB_MS,0,1),3),slide=(1-ps)*(SLAB/AX),drift=Math.sin(clamp(t/DRIFT_MS,0,1)*Math.PI/2)*DRIFT;const dist=(slide-drift)*W;setVar('--tx',dist*AX+'px');setVar('--ty',dist*AY+'px')}
if(!seen&&touch.matches&&!reduced.matches&&t>1600){const x=W*(.5+.30*Math.sin(now/1500));target.x=x;target.y=H*.49+(x-W*.4362)*Math.tan(AXIS)}m.x+=(target.x-m.x)*REV_LERP;m.y+=(target.y-m.y)*REV_LERP;setVar('--mx',m.x+'px');setVar('--my',m.y+'px');if(!reduced.matches&&(t<DRIFT_MS||touch.matches||Math.abs(m.x-target.x)>.2||Math.abs(m.y-target.y)>.2))raf=requestAnimationFrame(tick)}
function loop(){if(!raf&&running&&!document.hidden)raf=requestAnimationFrame(tick)}function play(){hero.classList.remove('is-playing');void hero.offsetWidth;hero.classList.add('is-playing');measure();t0=performance.now();doneAt=0;stage.classList.remove('done');setVar('--ox',W+BR+'px');const dist=reduced.matches?0:SLAB/AX*W;setVar('--tx',dist*AX+'px');setVar('--ty',dist*AY+'px');if(reduced.matches){stage.classList.add('done');target={x:W*.48,y:H*.55};m={...target}}running=true;loop()}
window.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;if(!seen){m.x=x;m.y=y}seen=true;target={x,y};loop()},{passive:true});window.addEventListener('pointerdown',e=>{const r=hero.getBoundingClientRect();seen=true;target={x:e.clientX-r.left,y:e.clientY-r.top};m={...target};loop()},{passive:true});window.addEventListener('resize',()=>{measure();loop()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else loop()});reduced.addEventListener('change',play);document.getElementById('play').onclick=play;document.getElementById('replay').onclick=play;
const fontReady=Promise.race([document.fonts?.ready||Promise.resolve(),new Promise(r=>setTimeout(r,900))]);const imagesReady=Promise.allSettled([...document.images].map(image=>image.decode?image.decode():Promise.resolve()));Promise.all([fontReady,Promise.race([imagesReady,new Promise(r=>setTimeout(r,1400))])]).then(()=>requestAnimationFrame(play));
</script></body></html>
