name: Weekly project sync
# Checks only the repositories approved in projects/approved-projects.json.
# If their public GitHub facts changed, it opens (or refreshes) one pull request for review.
# It never pushes to main, never deploys, and never changes Render or server settings.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
permissions:
  contents: read
concurrency:
  group: project-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the automation/project-sync branch only
      pull-requests: write   # open or update the review pull request
    env:
      SYNC_BRANCH: automation/project-sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Read approved repositories from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs --summary "$RUNNER_TEMP/summary.md"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- index.html projects/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in approved projects. No pull request created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate site before proposing changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/check-site.mjs
          node --test scripts/sync-projects.test.mjs

      - name: Open or update the review pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add index.html projects/
          git commit -m "Sync approved GitHub project cards"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$SYNC_BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "_Opened by the Weekly project sync workflow. Review before merging; merging into main is what publishes to Render._"
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh pr list --repo "$REPO" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --repo "$REPO" --base main --head "$SYNC_BRANCH" \
              --title "Update approved GitHub project cards" --body-file "$RUNNER_TEMP/body.md"
          fi
