name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate static site and all three languages
        run: node scripts/check-site.mjs

      - name: Test API behavior without external credentials
        run: node --test backend/service.test.mjs

      - name: Test the approved-project sync without network access
        run: node --test scripts/sync-projects.test.mjs
